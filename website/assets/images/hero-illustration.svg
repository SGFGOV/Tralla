  <rect x="264" y="268" width="40" height="4" rx="2" fill="#4B5563" />
  <rect x="264" y="276" width="80" height="2" rx="1" fill="#9CA3AF" />
  
  <rect x="240" y="290" width="120" height="24" rx="4" fill="white" stroke="#E5E7EB" stroke-width="1" />
  <circle cx="252" cy="302" r="6" fill="#818CF8" />
  <rect x="264" y="298" width="40" height="4" rx="2" fill="#4B5563" />
  <rect x="264" y="306" width="80" height="2" rx="1" fill="#9CA3AF" />
  
  <rect x="240" y="320" width="120" height="24" rx="4" fill="white" stroke="#E5E7EB" stroke-width="1" />
  <circle cx="252" cy="332" r="6" fill="#A5B4FC" />
