  <line x1="230" y1="180" x2="426" y2="180" stroke="#818CF8" stroke-width="2" stroke-dasharray="4 4" />
  <line x1="358" y1="88" x2="260" y2="130" stroke="#A5B4FC" stroke-width="2" stroke-dasharray="4 4" />
  
  <!-- Decorative Elements -->
