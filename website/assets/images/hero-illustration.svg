<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Elements -->
  <circle cx="300" cy="200" r="180" fill="#F3F4F6" opacity="0.5" />
  <circle cx="300" cy="200" r="120" fill="#E5E7EB" opacity="0.5" />
  
  <!-- Mobile Phone Frame -->
  <rect x="220" y="60" width="160" height="320" rx="20" fill="white" stroke="#D1D5DB" stroke-width="4" />
  <rect x="230" y="80" width="140" height="280" rx="2" fill="#F9FAFB" />
  
  <!-- App Interface Elements -->
  <!-- Header -->
