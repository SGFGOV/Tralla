  <circle cx="120" cy="130" r="15" fill="#6366F1" />
  <rect x="95" y="160" width="50" height="6" rx="3" fill="#4B5563" />
  <rect x="105" y="172" width="30" height="4" rx="2" fill="#9CA3AF" />
  
  <circle cx="480" cy="180" r="50" fill="white" stroke="#E5E7EB" stroke-width="2" />
  <circle cx="480" cy="160" r="15" fill="#818CF8" />
  <rect x="455" y="190" width="50" height="6" rx="3" fill="#4B5563" />
